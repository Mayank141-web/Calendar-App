# Builds MyCalendar for Windows, macOS and Linux and publishes the files to a GitHub Release.
# To release: bump the VERSION file, then push a matching tag (e.g. "v2.1"), or run it from the Actions tab.
name: Build & Release

on:
  push:
    tags: ["v*"]
    branches: [claude/fervent-knuth-0y7bmk]  # temporary: publishes v2.1 from this branch
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: MyCalendar
  JAVA_VERSION: "21"
  PROJECT_DIR: Calendar-App-main/CalendarApp
  # jdk.crypto.ec lets the built-in update check talk HTTPS to GitHub
  MODULES: java.desktop,java.prefs,jdk.crypto.ec

jobs:
  jar:
    name: Cross-platform JAR
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION file ($VERSION)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Compile and package JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          javac --release 17 -d build/classes src/main/java/Calendar/*.java
          cp -r src/main/resources/. build/classes/
          mkdir -p build/jar
          printf 'Implementation-Version: %s\n' "${{ steps.version.outputs.version }}" > build/manifest.txt
          jar --create --file build/jar/MyCalendar.jar --manifest build/manifest.txt --main-class Calendar.Main -C build/classes .
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.PROJECT_DIR }}/build/jar/MyCalendar.jar

  package:
    name: Package (${{ matrix.label }})
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows
          - os: macos-latest
            label: macOS-AppleSilicon
          - os: macos-15-intel
            label: macOS-Intel
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.jar.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: input

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build native packages
        run: |
          set -euo pipefail
          ICONS="$PROJECT_DIR/packaging"
          mkdir -p dist out
          COMMON=(--name "$APP_NAME" --app-version "$APP_VERSION" --vendor "$APP_NAME"
                  --description "Calendar and task manager with Light and Dark Mode"
                  --input input --main-jar MyCalendar.jar --main-class Calendar.Main
                  --add-modules "$MODULES"
                  --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=zip-9")

          case "$RUNNER_OS" in
            Windows)
              WIN=(--icon "$ICONS/icon.ico")
              jpackage "${COMMON[@]}" "${WIN[@]}" --type msi --dest out \
                --win-menu --win-shortcut --win-dir-chooser --win-per-user-install \
                --win-upgrade-uuid 5b0e4f53-7c43-4c2a-9b0e-6d2a1f1c8a20
              mv out/*.msi "dist/$APP_NAME-$APP_VERSION-Windows-x64.msi"
              jpackage "${COMMON[@]}" "${WIN[@]}" --type app-image --dest out
              # Marks the portable copy so the built-in updater sends it to the download page instead
              echo "Portable copy: download new versions from the Releases page." > "out/$APP_NAME/.portable"
              (cd out && 7z a -tzip "../dist/$APP_NAME-$APP_VERSION-Windows-x64-portable.zip" "$APP_NAME" > /dev/null)
              ;;
            macOS)
              jpackage "${COMMON[@]}" --icon "$ICONS/icon.icns" --type dmg --dest out \
                --mac-package-name "$APP_NAME"
              mv out/*.dmg "dist/$APP_NAME-$APP_VERSION-${{ matrix.label }}.dmg"
              ;;
            Linux)
              LNX=(--icon "$ICONS/icon-256.png")
              LNX_INSTALL=(--linux-shortcut --linux-menu-group Office --linux-app-category office)
              jpackage "${COMMON[@]}" "${LNX[@]}" "${LNX_INSTALL[@]}" --type deb --dest out
              mv out/*.deb "dist/$APP_NAME-$APP_VERSION-Linux-amd64.deb"
              jpackage "${COMMON[@]}" "${LNX[@]}" "${LNX_INSTALL[@]}" --type rpm --dest out
              mv out/*.rpm "dist/$APP_NAME-$APP_VERSION-Linux-x86_64.rpm"

              # Portable folder: works on any distro, just extract and run
              jpackage "${COMMON[@]}" "${LNX[@]}" --type app-image --dest out
              tar -C out -czf "dist/$APP_NAME-$APP_VERSION-Linux-x86_64.tar.gz" "$APP_NAME"

              # AppImage: single file that runs on any distro
              APPDIR=out/AppDir
              mkdir -p "$APPDIR"
              cp -r "out/$APP_NAME" "$APPDIR/$APP_NAME"
              cp "$ICONS/icon-256.png" "$APPDIR/mycalendar.png"
              cp "$PROJECT_DIR/packaging/mycalendar.desktop" "$APPDIR/mycalendar.desktop"
              printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/%s/bin/%s" "$@"\n' "$APP_NAME" "$APP_NAME" > "$APPDIR/AppRun"
              chmod +x "$APPDIR/AppRun"
              curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool "$APPDIR" "dist/$APP_NAME-$APP_VERSION-Linux-x86_64.AppImage"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: dist/*

  release:
    name: Publish release
    needs: [jar, package]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/claude/fervent-knuth-0y7bmk'
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.jar.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          mv release/MyCalendar.jar "release/$APP_NAME-$APP_VERSION.jar"
          # The installers and the built-in updater verify every download against this list
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: MyCalendar v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: .github/release-notes.md
          files: release/*

  # Installs the release that was just published with the terminal one-liners, on each OS
  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: [jar, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.jar.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          if [ "$RUNNER_OS" = macOS ]; then
            plutil -extract CFBundleShortVersionString raw /Applications/MyCalendar.app/Contents/Info.plist | grep -Fx "$APP_VERSION"
          else
            grep -F "app-version=$APP_VERSION" ~/.local/share/MyCalendar/lib/app/MyCalendar.cfg
            test -x ~/.local/bin/mycalendar
          fi
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          $cfg = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Filter MyCalendar.cfg -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cfg) { throw 'MyCalendar was not installed' }
          Write-Host "Installed at $($cfg.Directory.Parent.FullName)"
          if (-not (Select-String -Path $cfg.FullName -SimpleMatch "app-version=$env:APP_VERSION")) { throw 'Wrong version installed' }
